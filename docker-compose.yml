version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NODE_DB_URI=mongodb://mongo:27017/habitica
      - BASE_URL=http://localhost:3000
    ports:
      - "3000:3000"
    networks:
      - habitica

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - habitica
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 20s

networks:
  habitica:
    driver: bridge

volumes:
  mongo-data:
